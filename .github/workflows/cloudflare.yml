name: Validate
# Added from the workflow template cloudflare.yml of actions-fyi/.github. It dry-runs the Wrangler
# deployment, without deploying and without Cloudflare credentials. The dry run lives in
# _cloudflare.yml of actions-fyi/shared-workflows; see there.
#
# On pull requests and merge groups it is the gate; on a push to the default branch it only
# reports. The deployment itself isn't a workflow: Cloudflare's GitHub app (Workers Builds) builds
# and deploys every push to main.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions: {}

jobs:
  wrangler:
    name: Wrangler
    # What the jobs of _cloudflare.yml declare; a called job can't get more.
    permissions:
      contents: read # Read the Wrangler config and check the repository out
    uses: actions-fyi/shared-workflows/.github/workflows/_cloudflare.yml@v2.0.0
